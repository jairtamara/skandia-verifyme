<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Datos - Skandia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap">
    <style>
        :root {
            --canvas: #eef1f6;
            --surface: #ffffff;
            --surface-2: #f4f6fa;
            --sunken: #ececef;
            --hover: rgba(0,0,0,.075);
            --glow-1: rgba(0,199,61,.17);
            --glow-2: rgba(0,153,222,.15);
            --glow-3: rgba(0,153,222,.09);
            --ink: #404040;
            --ink-strong: #18202a;
            --ink-muted: #5c6672;
            --ink-faint: #a5a5a5;
            --line: #ededed;
            --line-strong: #d7dce2;
            --accent: #00c73d;
            --accent-ink: #00812c;
            --accent-tint: #e4fbde;
            --ok-wash: #f0fdf4;  --ok-tint: #dcfce7;  --ok-line: #bbf7d0;  --ok-ink: #166534;
            --warn-wash: #fff7ed; --warn-line: #fed7aa; --warn-ink: #c2410c;
            --danger-wash: #fdf2f2; --danger-soft: #f3a9a5; --danger-ink: #991b1b;
            --r-xs: 4px;
            --r-select: 10px;
            --r-badge: 20px;
            --r-pill: 50px;
            --r-card: 14px;
            --s-xs: 8px; --s-sm: 16px; --s-md: 24px; --s-lg: 36px; --s-xl: 40px;
            --page-max: 1200px;
            --shadow-card: 0 8px 24px rgba(31,45,79,.16);
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font: 400 14px/1.45 "Open Sans", system-ui, sans-serif;
            background: var(--canvas);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--s-md);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(60rem 40rem at 12% -8%, var(--glow-1), transparent 62%),
                radial-gradient(52rem 36rem at 92% 4%, var(--glow-2), transparent 60%),
                radial-gradient(46rem 34rem at 50% 108%, var(--glow-3), transparent 64%);
        }

        h1, h2, h3, .lbl, .pill, .chip, th, .btn {
            font-family: Montserrat, system-ui, sans-serif;
        }

        .container {
            background: var(--surface);
            border-radius: var(--r-card);
            box-shadow: var(--shadow-card);
            max-width: 600px;
            width: 100%;
            padding: var(--s-xl);
        }

        header {
            text-align: center;
            margin-bottom: var(--s-lg);
            padding-bottom: var(--s-md);
            border-bottom: 1px solid var(--line);
        }

        header h1 {
            color: var(--ink-strong);
            font: 700 28px/1.15 Montserrat, sans-serif;
            margin-bottom: var(--s-xs);
        }

        header p {
            color: var(--ink-muted);
            font-size: 13px;
        }

        .form-group {
            margin-bottom: var(--s-md);
        }

        label {
            display: block;
            color: var(--ink-strong);
            font: 700 11px/1.2 Montserrat, sans-serif;
            letter-spacing: .07em;
            text-transform: uppercase;
            margin-bottom: var(--s-xs);
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            font: 400 14px/1.2 "Open Sans", sans-serif;
            color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--line-strong);
            border-radius: var(--r-select);
            padding: 12px 14px;
        }

        input:focus,
        select:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-color: var(--accent);
        }

        .info-actual {
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: var(--r-select);
            padding: 12px 14px;
            margin-bottom: var(--s-md);
            font-size: 12px;
            color: var(--ink-muted);
        }

        .btn-container {
            display: flex;
            gap: var(--s-xs);
            margin-top: var(--s-lg);
        }

        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--s-xs);
            height: 44px;
            padding: 0 26px;
            border: 0;
            border-radius: var(--r-pill);
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            font: 700 13px/1 Montserrat, sans-serif;
            transition: filter .12s;
        }

        .btn:hover:not(:disabled) {
            filter: brightness(1.06);
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent-ink);
            outline-offset: 2px;
        }

        .btn.sec {
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--line-strong);
        }

        .btn.sec:hover {
            background: var(--hover);
        }

        .mensaje {
            padding: 18px 22px;
            border-radius: var(--r-select);
            margin-bottom: var(--s-md);
            display: none;
            border: 1px solid var(--line);
            border-left-width: 3px;
            font-size: 13px;
        }

        .mensaje.exito {
            background: var(--ok-wash);
            border-left-color: #00c73d;
            color: var(--ok-ink);
            display: block;
        }

        .mensaje.error {
            background: var(--danger-wash);
            border-left-color: #d22c27;
            color: var(--danger-ink);
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--ink-muted);
        }

        .spinner {
            border: 4px solid var(--sunken);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: var(--s-sm) auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .volver {
            display: block;
            margin-top: var(--s-lg);
            text-align: center;
        }

        a {
            color: var(--accent-ink);
            text-decoration: none;
            font: 700 13px/1 Montserrat, sans-serif;
        }

        a:hover {
            text-decoration: underline;
        }

        small {
            color: var(--ink-muted);
            display: block;
            margin-top: var(--s-xs);
            font-size: 12px;
        }

        @media (max-width: 767px) {
            .container {
                padding: var(--s-md);
            }
            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--line); text-align: left;">
            <img src="/static/icono.png" alt="Skandia Logo" style="width: 60px; height: auto; object-fit: contain; flex-shrink: 0;">
            <div>
                <h1 style="margin: 0 0 8px 0; font-size: 24px;">Actualizar Tus Datos</h1>
                <p style="margin: 0; color: var(--ink-muted); font-size: 13px;">Ayúdanos a mantener tu información al día en Skandia</p>
            </div>
        </header>

        <div id="mensaje" class="mensaje"></div>

        <form id="formActualizacion" onsubmit="guardarCambios(event)">
            <div class="form-group">
                <label>Nombre Completo</label>
                <div class="info-actual" id="infoNombre">-</div>
                <input type="text" id="nombre" placeholder="Ej: Juan García López">
            </div>

            <div class="form-group">
                <label>Email</label>
                <div class="info-actual" id="infoEmail">-</div>
                <input type="email" id="email" placeholder="Ej: juan@email.com" readonly>
                <small style="color: #999; display: block; margin-top: 5px;">*El email no puede ser modificado</small>
            </div>

            <div class="form-group">
                <label>Teléfono</label>
                <div class="info-actual" id="infoTelefono">-</div>
                <input type="tel" id="telefono" placeholder="Ej: +573101234567">
            </div>

            <div class="form-group">
                <label>Ciudad</label>
                <div class="info-actual" id="infoCiudad">-</div>
                <select id="ciudad">
                    <option value="">Selecciona una ciudad</option>
                    <option value="Bogotá">Bogotá</option>
                    <option value="Medellín">Medellín</option>
                    <option value="Cali">Cali</option>
                    <option value="Barranquilla">Barranquilla</option>
                    <option value="Cartagena">Cartagena</option>
                    <option value="Santa Marta">Santa Marta</option>
                    <option value="Manizales">Manizales</option>
                    <option value="Pereira">Pereira</option>
                    <option value="Armenia">Armenia</option>
                    <option value="Bucaramanga">Bucaramanga</option>
                    <option value="Cúcuta">Cúcuta</option>
                    <option value="Ibagué">Ibagué</option>
                    <option value="Villavicencio">Villavicencio</option>
                    <option value="Pasto">Pasto</option>
                    <option value="Popayán">Popayán</option>
                    <option value="Valledupar">Valledupar</option>
                    <option value="Montería">Montería</option>
                    <option value="Sincelejo">Sincelejo</option>
                    <option value="Quibdó">Quibdó</option>
                    <option value="Otra">Otra</option>
                </select>
            </div>

            <div class="btn-container">
                <button type="submit" class="btn" id="btnGuardar">Guardar Cambios</button>
                <button type="button" class="btn sec" onclick="volverAlInicio()">Cancelar</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Guardando cambios...</p>
            </div>
        </form>

        <div class="volver">
            <a href="/">← Volver al inicio</a>
        </div>
    </div>

    <script>
        let emailActual = '';

        document.addEventListener('DOMContentLoaded', function() {
            // Extraer email de URL
            const urlParams = new URLSearchParams(window.location.pathname);
            const email = window.location.pathname.split('/').pop();

            if (email) {
                emailActual = decodeURIComponent(email);
                cargarDatosCliente(emailActual);
            } else {
                mostrarMensaje('Error: No se especificó cliente', 'error');
            }
        });

        function cargarDatosCliente(email) {
            fetch(`/api/cliente/buscar?email=${encodeURIComponent(email)}`)
                .then(r => r.json())
                .then(data => {
                    const cliente = data.cliente;

                    // Mostrar datos actuales
                    document.getElementById('infoNombre').textContent = cliente.nombre || '-';
                    document.getElementById('infoEmail').textContent = cliente.email || '-';
                    document.getElementById('infoTelefono').textContent = cliente.telefono || 'No registrado';
                    document.getElementById('infoCiudad').textContent = cliente.ciudad || 'No registrada';

                    // Prellenar formulario
                    document.getElementById('email').value = cliente.email;
                    document.getElementById('nombre').placeholder = cliente.nombre;
                    document.getElementById('telefono').placeholder = cliente.telefono || '';
                    document.getElementById('ciudad').value = cliente.ciudad || '';
                })
                .catch(err => {
                    mostrarMensaje('Error al cargar datos del cliente: ' + err.message, 'error');
                });
        }

        function guardarCambios(event) {
            event.preventDefault();

            const nombre = document.getElementById('nombre').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const ciudad = document.getElementById('ciudad').value.trim();

            if (!nombre && !telefono && !ciudad) {
                mostrarMensaje('Por favor actualiza al menos un campo', 'error');
                return;
            }

            const actualizacion = {};
            if (nombre) actualizacion.nombre = nombre;
            if (telefono) actualizacion.telefono = telefono;
            if (ciudad) actualizacion.ciudad = ciudad;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('btnGuardar').disabled = true;

            fetch(`/api/cliente/${emailActual}/actualizar`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(actualizacion)
            })
                .then(r => r.json())
                .then(data => {
                    mostrarMensaje('✅ ' + data.mensaje, 'exito');
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('btnGuardar').disabled = false;

                    setTimeout(() => {
                        volverAlInicio();
                    }, 2000);
                })
                .catch(err => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('btnGuardar').disabled = false;
                    mostrarMensaje('Error: ' + err.message, 'error');
                });
        }

        function mostrarMensaje(texto, tipo) {
            const elem = document.getElementById('mensaje');
            elem.textContent = texto;
            elem.className = 'mensaje ' + tipo;
        }

        function volverAlInicio() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
